name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at the same time
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  APP_DIR: /home/${{ secrets.SSH_USER }}/node-app

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check SSH secrets
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          # Short hashes let you compare values without revealing them
          echo "SSH_USER length=${#SSH_USER} hash=$(printf '%s' "$SSH_USER" | sha256sum | cut -c1-12)  (ubuntu = 7804a56a5c76)"
          echo "SSH_HOST length=${#SSH_HOST} hash=$(printf '%s' "$SSH_HOST" | sha256sum | cut -c1-12)  (18.209.56.208 = f8fcb7686150)"

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" | tr -d '\r' > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          # Fails early if SSH_KEY is not a valid private key; prints its public fingerprint
          ssh-keygen -y -f ~/.ssh/ec2.pem > /dev/null
          ssh-keygen -lf ~/.ssh/ec2.pem
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
          # Only use this key, and fail instead of prompting
          printf 'Host *\n  IdentityFile ~/.ssh/ec2.pem\n  IdentitiesOnly yes\n  BatchMode yes\n' > ~/.ssh/config
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "echo SSH connection OK"

      - name: Copy project files to EC2
        run: |
          ssh -i ~/.ssh/ec2.pem ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "mkdir -p $APP_DIR"
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            -e "ssh -i ~/.ssh/ec2.pem" \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:$APP_DIR/

      - name: Build and restart container
        run: |
          ssh -i ~/.ssh/ec2.pem ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            set -e
            cd $APP_DIR
            docker compose up -d --build --remove-orphans
            docker image prune -f
          "

      - name: Health check
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "http://${{ secrets.SSH_HOST }}:8080"; then
              echo; echo "App is up"
              exit 0
            fi
            echo "Waiting for app... ($i/10)"
            sleep 3
          done
          echo "App did not respond on port 8080"
          exit 1
